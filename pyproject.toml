[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdscan"
version = "0.2.0rc1"
description = "Поверхностный HTTP-сканер сайтов: технические наблюдения по ПДн"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "PDScan project"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.64.0"]

[project.scripts]
pdscan = "pdscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdscan = ["report.schema.json", "report-1.0.schema.json", "browser_probe.js"]
